name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test build output
        run: |
          node -e "import('ssm-config-loader').then(m => { if (typeof m.loadSsmConfig !== 'function') process.exit(1); })"
          node -e "import('ssm-config-loader/singleton-config-getter').then(m => { if (typeof m.createSingletonConfigGetter !== 'function') process.exit(1); })"

      - name: Codecov
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
